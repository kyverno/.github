name: Test PR Branch Updater Contract

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Base branch filter to use for contract test
        required: false
        default: does-not-exist
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  contract-test:
    name: Call reusable workflow (safe mode)
    uses: ./.github/workflows/pr-branch-updater.yml
    with:
      base_branch: ${{ inputs.base_branch }}
      # The app secrets live in this environment, whose branch rules allow
      # only main.
      environment: pr-updater-app
    # A reusable workflow sees only the secrets its caller passes, even when
    # its job runs in an environment. inherit makes the environment's
    # PR_UPDATER_APP_* secrets visible to the job.
    secrets: inherit